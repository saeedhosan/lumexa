name: Build

on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Container tests
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Create environment file
              run: cp -n .env.example .env

            - name: Run tests
              run: docker compose run --rm app composer test

    production-images:
        name: Production images
        needs: tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            APP_TARGET: production
            APP_ENV: production
            APP_DEBUG: "false"
            APP_URL: http://127.0.0.1:8000
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Create environment file
              run: cp -n .env.example .env

            - name: Build production image
              run: docker compose build app

            - name: Run migrations
              run: docker compose run --rm migrate

            - name: Start the application
              run: docker compose up -d --wait app

            - name: Health check
              run: curl -fsS --retry 10 --retry-all-errors --retry-delay 2 --retry-connrefused "http://127.0.0.1:8000/health"
