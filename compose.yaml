name: lumexa

x-app-common: &app-common
  image: lumexa:${APP_TARGET:-dev}
  build:
    context: .
    dockerfile: Dockerfile
    target: ${APP_TARGET:-dev}
  env_file: &env-file
    - path: .env
      required: false
  environment: &app-env
    APP_TARGET: ${APP_TARGET:-dev}
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_KEY: ${APP_KEY:-base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=}
    APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8000}}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-lumexa}
    DB_USERNAME: ${DB_USERNAME:-lumexa}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: database
    BROADCAST_CONNECTION: reverb
    OCTANE_SERVER: frankenphp
    REVERB_APP_ID: ${REVERB_APP_ID:-lumexa}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-lumexa-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-lumexa-secret}
    REVERB_HOST: ${REVERB_HOST:-localhost}
    REVERB_PORT: ${REVERB_PORT:-8081}
    REVERB_SCHEME: ${REVERB_SCHEME:-http}
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: "8080"
  volumes: &app-volumes
    - ./:/var/www/html
    - /var/www/html/bootstrap/cache
    - /var/www/html/vendor
    - /var/www/html/node_modules
    - /var/www/html/public/build
    - /var/www/html/storage/framework/testing
    - /var/www/html/storage/framework/views
    - /var/www/html/frankenphp
  depends_on: &app-depends
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
    test:
        profiles: [ test ]
        image: docker:cli
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - .:${PWD}
        working_dir: ${PWD}
        entrypoint: [ "/bin/sh", "-c" ]
        environment:
            APP_TARGET: ${APP_TARGET:-dev}
        command:
            - |
              set -e
              docker compose run --rm app composer test

    migrate:
        <<: *app-common
        profiles: [ migrate ]
        healthcheck:
            disable: true
        command: [ "php", "artisan", "migrate", "--force" ]
        restart: "no"

    app:
        <<: *app-common
        ports:
            - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"

    worker:
        <<: *app-common
        healthcheck:
            disable: true
        command:
            - php
            - artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --max-time=3600

    scheduler:
        <<: *app-common
        healthcheck:
            disable: true
        command: [ "php", "artisan", "schedule:work" ]

    reverb:
        <<: *app-common
        healthcheck:
            disable: true
        ports:
            - "${REVERB_BIND:-127.0.0.1}:${FORWARD_REVERB_PORT:-8081}:8080"
        command: [ "php", "artisan", "reverb:start" ]

    web:
        <<: *app-common
        working_dir: /var/www/html
        entrypoint: []
        environment:
            <<: *app-env
            VITE_APP_NAME: ${APP_NAME:-lumexa}
            VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-lumexa-key}
            VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
            VITE_REVERB_PORT: ${REVERB_PORT:-8081}
            VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
        ports:
            - "${WEB_BIND:-127.0.0.1}:${VITE_PORT:-5173}:5173"
        healthcheck:
            disable: true
        depends_on:
            app:
                condition: service_started
        command: [ "sh", "-c", "bun install --frozen-lockfile && bun --bun run dev -- --host 0.0.0.0" ]

    mysql:
        image: mysql:8.0
        env_file: *env-file
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-secret}}
            MYSQL_DATABASE: ${DB_DATABASE:-lumexa}
            MYSQL_USER: ${DB_USERNAME:-lumexa}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "${DB_BIND:-127.0.0.1}:${FORWARD_DB_PORT:-3306}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
        command: [ "sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"" ]
        ports:
            - "${REDIS_BIND:-127.0.0.1}:${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        restart: unless-stopped

volumes:
    mysql_data:
    redis_data:
